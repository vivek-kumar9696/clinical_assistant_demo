<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WardlyAI | Admin Dashboard</title>
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">WardlyAI Admin</div>
            <div class="nav-links">
                <a href="index.html">Call Agent</a>
                <a href="admin.html" class="active">Admin Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <h2>Patient Interaction Logs</h2>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Date & Time of Call</th>
                    <th>Appointed Doctor</th>
                    <th>Appointment Date & Time</th>
                    <th>Brief</th>
                </tr>
            </thead>
            <tbody id="logTable">
                <!-- Injected via admin.js -->
            </tbody>
        </table>
    </div>

    <div id="briefModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="tab-container">
                    <!-- Tabs to switch views -->
                    <button class="tab-btn active" onclick="switchTab(event, 'clinicianView')">Clinical View</button>
                    <button class="tab-btn" onclick="switchTab(event, 'jsonView')">Raw Data (JSON)</button>
                </div>
            </div>

            <div class="modal-body">
                <!-- 1. The Clinician View (Default) -->
                <div id="clinicianView" class="tab-content active">
                    <!-- Content injected via JS -->
                </div>

                <!-- 2. The JSON Developer View -->
                <div id="jsonView" class="tab-content">
                    <pre id="jsonContent"></pre>
                </div>
            </div>

            <div class="modal-footer">
                <button class="close-btn" onclick="document.getElementById('briefModal').style.display='none'">Close</button>
            </div>
        </div>
    </div>

    <script src="./src/admin.js"></script>
</body>
</html>
